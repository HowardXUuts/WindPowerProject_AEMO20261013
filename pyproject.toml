[project]
name = "aemo-wind"
version = "0.1.0"
description = "Australian wind power data platform built on AEMO dispatch SCADA data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Only for scripts/refresh_reference.py, which is run by hand a few times a
# year. Kept out of the default install so the hourly ingest stays lean.
reference = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-calamine>=0.2",
]

[tool.setuptools]
# Nothing here is an importable package: scripts/ is a script directory that
# tests put on sys.path via conftest. Say so explicitly, or setuptools scans
# the project root and refuses to choose between sql/, data/ and assistant/.
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires outbound network access (deselected by default)",
]
addopts = "-m 'not network'"
