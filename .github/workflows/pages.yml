name: Deploy dashboard

# Gold changing is what makes the dashboard stale, so that is the trigger. The
# JSON slices are regenerated here rather than committed: they are derived from
# gold and would otherwise be a second copy of the same numbers in git history,
# able to disagree with the tables they came from.
on:
  push:
    branches: [main]
    paths:
      - "data/gold/**"
      - "docs/**"
      - "sql/dashboard/**"
      - "scripts/export_dashboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a deploy in flight; just queue behind it.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check .

      - name: Export dashboard data from gold
        run: python scripts/export_dashboard.py

      - name: Show what will be published
        run: |
          echo "docs/data:"
          ls -la docs/data
          echo "total: $(du -sh docs | cut -f1)"

      # Pages must already be enabled on the repository, once, by hand:
      # Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
      #
      # This cannot be automated from here. The enablement: true input asks the
      # action to create the site, but the automatic GITHUB_TOKEN is refused:
      # "Create Pages site failed. Error: Resource not accessible by
      # integration". pages: write permits deploying to a site that exists; it
      # does not permit creating one, which needs admin rights the workflow
      # token does not carry. Leaving the input off gives the clearer of the
      # two errors, which names the setting to change.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
