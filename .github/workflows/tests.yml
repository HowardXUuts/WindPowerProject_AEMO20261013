name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Includes the reference extras: without them the registry tests skip,
        # and a skipped regression test protects nothing. The hourly ingest
        # still installs plain '.', so the runtime stays lean.
        run: pip install --disable-pip-version-check '.[dev,reference]'

      - name: Lint
        run: ruff check scripts tests

      - name: Test
        # Network-marked tests are deselected by pyproject's addopts; the suite
        # runs entirely against fixtures.
        run: pytest -q

      - name: ML feature build and readiness
        # Builds the feature table from the committed silver layer and reports
        # whether any region can yet be trained. It is green either way: "not
        # enough data" is the expected state for months, and a red run every
        # hour would train everyone to ignore it. What this does catch is the
        # feature SQL breaking against a silver schema change, which is the
        # failure that would otherwise surface in December.
        run: python scripts/build_features.py --check

      - name: Assistant eval
        # No credential and no network: the eval serves recorded replies where
        # they exist, and always re-runs every reference query against the
        # committed gold layer. That second part is what stops the question set
        # rotting silently when the gold schema moves.
        run: python assistant/eval.py
